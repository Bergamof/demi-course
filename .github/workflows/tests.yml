name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  domain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      # Turns the JUnit XML into a per-test table shown in the PR: a check run
      # with the full results, a summary comment, and inline annotations on the
      # lines that failed. Runs even when the tests failed — that's the point.
      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          check_name: Domain test results
          comment_mode: always
          files: domain/build/test-results/test/*.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-test-report
          path: domain/build/reports/tests/test
          if-no-files-found: ignore

  # The app module has no tests, but it does need to compile: this is the only
  # thing that checks app/build.gradle.kts (per-variant versioning, signing
  # config) and the Compose code before a merge kicks off a release.
  app-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The action's default package set still includes `tools`, which no longer
      # exists in the SDK repository and fails the whole step, so the packages
      # compileSdk 35 needs are spelled out.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      # The dev variant: same build script and same code as the release, minus
      # the need for a signing key.
      - name: Build the dev APK
        run: ./gradlew :app:assembleDebug
