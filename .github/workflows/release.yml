name: Release

# A release is published only on manual trigger (Actions tab > Release > Run
# workflow, or `gh workflow run release.yml`): a "yyyy.MM.dd-n" tag where n is
# that day's publication rank, with the prod APK attached. Merging to main
# publishes nothing.
on:
  workflow_dispatch:

permissions: {}

# Two triggers close together would compute the same rank if they ran in
# parallel, so they are serialized.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    # The release is cut from main only, even if another branch is picked in
    # the "Run workflow" form.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The existing tags give the day's rank, and the history gives the
          # commits this release contains.
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      # The action's default package set still includes `tools`, which no longer
      # exists in the SDK repository and fails the whole step, so the packages
      # compileSdk 37 needs are spelled out.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Paris time: the publication date is the one where the project
          # lives, not the runner's (UTC).
          date="$(TZ=Europe/Paris date +%Y.%m.%d)"

          # That day's publication rank: the highest suffix already used, plus
          # one.
          last="$(git tag --list "${date}-*" \
                  | sed "s/^${date}-//" \
                  | grep -E '^[0-9]+$' \
                  | sort -n \
                  | tail -1 || true)"
          seq=$(( ${last:-0} + 1 ))
          if (( seq > 99 )); then
            echo "::error::99 releases already published on ${date}; the versionCode cannot go further." >&2
            exit 1
          fi

          version="${date}-${seq}"
          # yy mm dd nn, increasing from one release to the next.
          version_code=$(( (10#${date:2:2} * 10000 + 10#${date:5:2} * 100 + 10#${date:8:2}) * 100 + seq ))

          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
          echo "Version: $version (versionCode $version_code)"

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK will come out unsigned." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "keystore=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName="$VERSION" \
            -PappVersionCode="$VERSION_CODE"

      - name: Collect APK
        id: apk
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$src" ]] || { echo "::error::no APK was produced." >&2; exit 1; }
          dest="${RUNNER_TEMP}/demi-course-${VERSION}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$dest")" > "$(basename "$dest").sha256")
          ls -l "$dest"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"

          # `head` closes the pipe early: without `|| true`, pipefail would
          # kill the script on git's SIGPIPE.
          previous="$(git tag --list --sort=-creatordate \
                      | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$' \
                      | head -1 || true)"
          {
            echo "Version \`${VERSION}\` (versionCode ${VERSION_CODE})."
            echo
            echo "### Changements"
            echo
            git log --no-merges --max-count=50 --pretty='- %s' "${previous:+${previous}..}HEAD"
            if [[ "$SIGNED" != "true" ]]; then
              echo
              echo "> ⚠️ APK **non signé** : aucun keystore de release n'est configuré dans"
              echo "> les secrets du dépôt, l'installation sur un téléphone échouera."
              echo "> Voir « Publication » dans le README."
            fi
          } > "$notes"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            "$APK" "$APK.sha256"
