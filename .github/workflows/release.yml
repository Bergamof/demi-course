name: Release

# Chaque arrivée sur main (merge d'une PR, push direct) publie une release
# GitHub : un tag « aaaa.mm.jj-n » où n est le rang de la publication dans la
# journée, et l'APK de prod en pièce jointe.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Deux merges rapprochés calculeraient le même rang s'ils tournaient en
# parallèle : on les sérialise.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Les tags existants servent à calculer le rang du jour, et
          # l'historique à lister les commits de la release.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute version
        id: version
        run: |
          set -euo pipefail
          # Heure de Paris : la date de publication est celle du lieu de vie du
          # projet, pas celle du runner (UTC).
          date="$(TZ=Europe/Paris date +%Y.%m.%d)"

          # Rang de la publication dans la journée : le plus grand suffixe déjà
          # utilisé, plus un.
          last="$(git tag --list "${date}-*" \
                  | sed "s/^${date}-//" \
                  | grep -E '^[0-9]+$' \
                  | sort -n \
                  | tail -1 || true)"
          seq=$(( ${last:-0} + 1 ))
          if (( seq > 99 )); then
            echo "::error::99 releases déjà publiées le ${date} ; le versionCode ne peut pas aller plus loin." >&2
            exit 1
          fi

          version="${date}-${seq}"
          # aa mm jj rr, croissant d'une release à la suivante.
          version_code=$(( (10#${date:2:2} * 10000 + 10#${date:5:2} * 100 + 10#${date:8:2}) * 100 + seq ))

          {
            echo "version=$version"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"
          echo "Version : $version (versionCode $version_code)"

      - name: Run domain unit tests
        run: ./gradlew :domain:test

      - name: Decode signing keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            echo "Pas de secret ANDROID_KEYSTORE_BASE64 : l'APK sortira non signé." >&2
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${RUNNER_TEMP}/release.jks"
          echo "keystore=${RUNNER_TEMP}/release.jks" >> "$GITHUB_OUTPUT"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.keystore }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -PappVersionName="${{ steps.version.outputs.version }}" \
            -PappVersionCode="${{ steps.version.outputs.version_code }}"

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          src="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          [[ -n "$src" ]] || { echo "::error::aucun APK produit." >&2; exit 1; }
          dest="${RUNNER_TEMP}/demi-course-${{ steps.version.outputs.version }}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"
          ls -l "$dest"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          APK: ${{ steps.apk.outputs.path }}
          SIGNED: ${{ steps.keystore.outputs.signed }}
        run: |
          set -euo pipefail
          notes="$(mktemp)"

          # `head` ferme le tuyau tôt : sans `|| true`, pipefail ferait sortir
          # le script sur le SIGPIPE de git.
          previous="$(git tag --list --sort=-creatordate \
                      | grep -E '^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9]+$' \
                      | head -1 || true)"
          {
            echo "Version \`${VERSION}\` (versionCode ${{ steps.version.outputs.version_code }})."
            echo
            echo "### Changements"
            echo
            git log --no-merges --max-count=50 --pretty='- %s' "${previous:+${previous}..}HEAD"
            if [[ "$SIGNED" != "true" ]]; then
              echo
              echo "> ⚠️ APK **non signé** : aucun keystore de release n'est configuré dans"
              echo "> les secrets du dépôt, l'installation sur un téléphone échouera."
              echo "> Voir « Publication » dans le README."
            fi
          } > "$notes"

          gh release create "$VERSION" \
            --title "$VERSION" \
            --notes-file "$notes" \
            --target "$GITHUB_SHA" \
            "$APK"
