name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format (ktlint)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"
      - name: ktlint
        shell: bash # -eo pipefail: a failing Gradle must not be hidden by `tee`
        run: ./gradlew ktlintCheck 2>&1 | tee lint.log
      - name: Summary
        id: summary
        if: always()
        run: |
          errors="$(grep -cE '^[^ ]+\.kts?:[0-9]+:[0-9]+ ' lint.log || true)"
          echo "summary=${errors} violation(s)" >> "$GITHUB_OUTPUT"

  test:
    name: Tests (domain)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Run domain tests
        run: ./gradlew :domain:test
      - name: Summary
        id: summary
        if: always()
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          total = failed = skipped = 0
          for path in glob.glob("domain/build/test-results/test/*.xml"):
              root = ET.parse(path).getroot()
              total += int(root.get("tests", 0))
              failed += int(root.get("failures", 0)) + int(root.get("errors", 0))
              skipped += int(root.get("skipped", 0))
          print(f"summary={total - failed - skipped}/{total} passed, {failed} failed, {skipped} skipped")
          PY

  build:
    name: Build (debug APK)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: "platform-tools platforms;android-37 build-tools;36.0.0"
      # Release too, so that R8 (minification) problems surface before a manual release.
      - name: Build the dev and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease
      - name: Summary
        id: summary
        if: always()
        run: |
          apk="$(find app/build/outputs/apk/debug -name '*.apk' -print -quit 2>/dev/null || true)"
          if [[ -n "$apk" ]]; then
            echo "summary=APK $(du -h "$apk" | cut -f1)" >> "$GITHUB_OUTPUT"
          else
            echo "summary=no APK produced" >> "$GITHUB_OUTPUT"
          fi

  security:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.summary.outputs.summary }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        shell: bash # -eo pipefail: a failing scan must not be hidden by `tee`
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose 2>&1 | tee gitleaks.log
      - name: Summary
        id: summary
        if: always()
        run: |
          if grep -q 'no leaks found' gitleaks.log; then
            echo "summary=no leak found" >> "$GITHUB_OUTPUT"
          else
            echo "summary=see logs" >> "$GITHUB_OUTPUT"
          fi

  report:
    name: Compte rendu
    needs: [lint, test, build, security]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            try {
              const needs = JSON.parse(process.env.NEEDS);
              const icons = { success: '✅', failure: '❌', cancelled: '⚠️', skipped: '⏭️' };
              const results = Object.values(needs).map(n => n.result);
              const global = results.every(r => r === 'success') ? '✅'
                : results.includes('failure') ? '❌' : '⚠️';
              const rows = Object.entries(needs).map(([job, n]) =>
                `| ${job} | ${icons[n.result] ?? '❔'} ${n.result} | ${n.outputs?.summary || '—'} |`);
              const sha = context.payload.pull_request.head.sha.slice(0, 7);
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              const body = [
                `## ${global} Compte rendu CI`,
                '',
                `Commit testé : \`${sha}\` — [logs détaillés](${runUrl})`,
                '',
                '| Vérification | Résultat | Résumé |',
                '|---|---|---|',
                ...rows,
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            } catch (error) {
              // Le compte rendu reflète les résultats sans les juger : il ne fait jamais échouer la CI.
              core.warning(`Commentaire de compte rendu non publié : ${error.message}`);
            }
